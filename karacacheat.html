<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KARACA CHEAT - AI Arıza Asistanı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            min-height: 100vh;
            padding-bottom: 100px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #fbbf24;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.03) 10px,
                rgba(255,255,255,0.03) 20px
            );
            animation: scan 20s linear infinite;
        }
        @keyframes scan {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(59,130,246,0.8);
            position: relative;
        }
        .header p {
            font-size: 14px;
            color: #fbbf24;
            margin-top: 5px;
            position: relative;
        }
        .ai-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
            50% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
        }
        
        /* Container */
        .container {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* Search Card */
        .search-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .search-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Input Grid */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .input-group {
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            background: #f9fafb;
            transition: all 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
        }
        
        /* Search Button */
        .search-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 30px rgba(59,130,246,0.5);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(59,130,246,0.6);
        }
        .search-btn:active {
            transform: translateY(0);
        }
        .search-btn.loading {
            opacity: 0.8;
            cursor: wait;
        }
        
        /* Results Card */
        .results-card {
            background: rgba(255,255,255,0.98);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            display: none;
        }
        .results-card.show {
            display: block;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .results-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e5e7eb;
        }
        .device-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .device-info h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1f2937;
        }
        .device-info p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 2px;
        }
        
        /* Error Code Card */
        .error-card {
            background: linear-gradient(135deg, #fef2f2 0%, #fff5f5 100%);
            border: 2px solid #fecaca;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .error-card:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 30px rgba(239,68,68,0.15);
        }
        .error-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .error-code {
            background: #dc2626;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .error-severity {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .severity-high { background: #fecaca; color: #991b1b; }
        .severity-medium { background: #fde68a; color: #92400e; }
        .severity-low { background: #bbf7d0; color: #166534; }
        
        .error-title {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .error-desc {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        
        /* Solution Box */
        .solution-box {
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border: 2px solid #6ee7b7;
            border-radius: 12px;
            padding: 16px;
        }
        .solution-title {
            font-size: 14px;
            font-weight: 700;
            color: #059669;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .solution-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .solution-list li {
            padding: 6px 0;
            font-size: 13px;
            color: #374151;
            border-bottom: 1px dashed #d1d5db;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .solution-list li:last-child {
            border-bottom: none;
        }
        .solution-list li::before {
            content: '✓';
            color: #10b981;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        /* Stats */
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: #f3f4f6;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #1e40af;
        }
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
        }
        
        /* Loading Animation */
        .loading-container {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .loading-container.show {
            display: block;
        }
        .ai-thinking {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 16px;
            color: #4b5563;
            font-weight: 500;
        }
        .loading-text::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        /* No Results */
        .no-results {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .no-results svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        /* Navigation */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.98);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #9ca3af;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .nav-item:hover {
            color: #3b82f6;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1e40af;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

    <script>
        // Arıza kodları veritabanı
        const ARIZA_KODLARI = {
            // Çamaşır Makineleri
            camasir: {
                arcelik: {
                    'E01': { title: 'Kapı Kilidi Arızası', severity: 'high', desc: 'Kapı kilit mekanizması düzgün çalışmıyor veya kapı tam kapanmıyor.', solutions: ['Kapının tam kapanıp kapanmadığını kontrol edin', 'Kapı kilidi mekanizmasını temizleyin', 'Kilidin elektrik bağlantılarını kontrol edin', 'Gerekirse kapı kilidi şalterini değiştirin'] },
                    'E02': { title: 'Su Alım Arızası', severity: 'medium', desc: 'Makine su alamıyor veya su basıncı yetersiz.', solutions: ['Musluk vanasının açık olduğundan emin olun', 'Su giriş hortumunu kontrol edin', 'Su filtresini temizleyin', 'Su basıncını kontrol edin (0.5-10 bar arası olmalı)'] },
                    'E03': { title: 'Su Boşaltma Arızası', severity: 'medium', desc: 'Makine suyu boşaltamıyor.', solutions: ['Boşaltma hortumunu kontrol edin', 'Pompa filtresini temizleyin', 'Boşaltma pompasını kontrol edin', 'Hortumun bükülmediğinden emin olun'] },
                    'E04': { title: 'Motor Arızası', severity: 'high', desc: 'Motor devreye girmiyor veya aşırı ısınıyor.', solutions: ['Karbon fırçaları kontrol edin', 'Motor termik sigortasını kontrol edin', 'Motor kablo bağlantılarını kontrol edin', 'Gerekirse motoru değiştirin'] },
                    'E05': { title: 'Sıcaklık Sensörü Arızası', severity: 'medium', desc: 'NTC sensörü hatalı sıcaklık değeri okuyor.', solutions: ['Sıcaklık sensörü bağlantılarını kontrol edin', 'Sensör direncini ölçün (20-30 kΩ olmalı)', 'Sensör kablosunu kontrol edin', 'Gerekirse sensörü değiştirin'] },
                    'E06': { title: 'Su Seviye Arızası', severity: 'medium', desc: 'Su seviye basınç şalteri hatalı değer veriyor.', solutions: ['Basınç şalteri hortumunu kontrol edin', 'Şalterin tıkanık olmadığından emin olun', 'Şalter bağlantılarını kontrol edin', 'Gerekirse basınç şalterini değiştirin'] },
                    'E07': { title: 'Aşırı Köpük Arızası', severity: 'low', desc: 'Makinede aşırı köpük oluşumu tespit edildi.', solutions: ['Deterjan miktarını azaltın', 'Deterjan gözünü temizleyin', 'Programı durdurun ve tekrar başlatın', 'Doğru deterjan kullandığınızdan emin olun'] },
                    'E08': { title: 'Dengesiz Yük', severity: 'low', desc: 'Çamaşırlar dengesiz dağılmış durumda.', solutions: ['Çamaşırları yeniden düzenleyin', 'Makinayı boşaltıp tekrar doldurun', 'Yükü dengeli dağıtın', 'Programı yeniden başlatın'] },
                    'E09': { title: 'Elektronik Kart Arızası', severity: 'high', desc: 'Ana kontrol kartında yazılım veya donanım hatası.', solutions: ['Kart üzerinde yanmış komponent kontrolü', 'EEPROM çipini kontrol edin', 'Kart bağlantılarını yeniden takın', 'Gerekirse kartı değiştirin'] },
                    'E10': { title: 'İletişim Arızası', severity: 'medium', desc: 'Ekran kartı ile ana kart arasında iletişim kopukluğu.', solutions: ['İletişim kablolarını kontrol edin', 'Konektörleri yeniden takın', 'Ekran kartını kontrol edin', 'Ana kart iletişim portunu kontrol edin'] },
                    'E11': { title: 'Motor Tacho Arızası', severity: 'high', desc: 'Motor hız sensörü (tacho) hatalı sinyal veriyor.', solutions: ['Tacho sensör bağlantılarını kontrol edin', 'Sensör ile motor arası mesafeyi kontrol edin', 'Sensör direncini ölçün', 'Gerekirse tacho sensörünü değiştirin'] },
                    'E12': { title: 'Su Isıtıcı Arızası', severity: 'medium', desc: 'Rezistans (ısıtıcı) çalışmıyor veya açık devre.', solutions: ['Rezistans direncini ölçün (20-40 Ω olmalı)', 'Rezistans bağlantılarını kontrol edin', 'Termik sigortayı kontrol edin', 'Gerekirse rezistansı değiştirin'] },
                    'E13': { title: 'Fan Motoru Arızası', severity: 'medium', desc: 'Kurutma fan motoru devreye girmiyor.', solutions: ['Fan motoru bağlantılarını kontrol edin', 'Motor sargı direncini ölçün', 'Fan kanatlarının takılı olmadığından emin olun', 'Gerekirse fan motorunu değiştirin'] },

        // Show toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Analyze function - Google Gemini API
        async function analizEt() {
            const marka = document.getElementById('marka').value.trim();
            const tur = document.getElementById('tur').value.trim();
            const model = document.getElementById('model').value.trim();
            const arizaKodu = document.getElementById('arizaKodu').value.trim();
            
            if (!marka || !tur) {
                showToast('Lütfen marka ve cihaz türü giriniz');
                return;
            }
            
            // Loading state
            document.getElementById('errorList').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>AI analiz ediliyor...</p>
                    <p style="font-size:12px;color:#6b7280;margin-top:10px">Google Gemini bağlantısı kuruluyor</p>
                </div>
            `;
            document.getElementById('resultsCard').classList.add('show');
            
            try {
                // Google Gemini API çağrısı
                const prompt = `
Cihaz bilgileri:
- Marka: ${marka}
- Tür: ${tur}
- Model: ${model || 'Belirtilmemiş'}
- Arıza Kodu: ${arizaKodu || 'Belirtilmemiş'}

Lütfen bu cihaz için olası arızaları, arıza kodlarını, nedenlerini ve çözüm önerilerini aşağıdaki formatta listeleyin:

1. ARIZA KODU: [KOD]
   - Arıza Adı: [AD]
   - Risk Seviyesi: [YÜKSEK/ORTA/DÜŞÜK]
   - Açıklama: [DETAYLI AÇIKLAMA]
   - Çözüm Önerileri:
     • [ÇÖZÜM 1]
     • [ÇÖZÜM 2]
     • [ÇÖZÜM 3]

Lütfen en az 3-5 farklı arıza senaryosu sunun. Gerçek servis tecrübesine dayalı, pratik çözümler verin.
`;

                // CORS proxy kullan - Cloudflare Workers
                const proxyUrl = 'https://karaca-ai-proxy.workers.dev/gemini'; // Cloudflare Worker URL
                
                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    {
                                        text: `Sen uzun yıllara dayalı tecrübesi olan bir servis teknisyenisin. Kullanıcıya cihaz arızaları hakkında detaylı ve pratik bilgiler sunuyorsun.\n\n${prompt}`
                                    }
                                ]
                            }
                        ],
                        generationConfig: {
                            temperature: 0.3,
                            maxOutputTokens: 2000,
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Gemini API bağlantısı başarısız');
                }
                
                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                
                // AI yanıtını parse et ve göster
                const aiHatalar = parseAIResponse(aiResponse);
                gosterSonuclar(marka, tur, model, aiHatalar);
                
            } catch (error) {
                console.error('Gemini API Error:', error);
                
                // GitHub Pages'de CORS hatası için özel mesaj
                const isGitHubPages = window.location.hostname.includes('github.io');
                if (isGitHubPages) {
                    showToast('GitHub Pages CORS kısıtlaması - Yerel veritabanı kullanılıyor...');
                } else {
                    showToast('AI bağlantısı başarısız, yerel veritabanı kullanılıyor...');
                }
                
                setTimeout(() => {
                    const hatalar = getHatalar(marka, tur, arizaKodu);
                    gosterSonuclar(marka, tur, model, hatalar);
                }, 1500);
            }
        }
        
        // AI yanıtını parse et
        function parseAIResponse(response) {
            const hatalar = [];
            const sections = response.split(/\d+\.\s*ARIZA\s*KODU:/i);
            
            for (let i = 1; i < sections.length; i++) {
                const section = sections[i].trim();
                if (!section) continue;
                
                const hata = {
                    kod: 'AI-' + String(i).padStart(3, '0'),
                    title: '',
                    desc: '',
                    severity: 'medium',
                    solutions: []
                };
                
                // Parse sections
                const lines = section.split('\n').map(line => line.trim()).filter(line => line);
                
                for (const line of lines) {
                    if (line.startsWith('Arıza Adı:')) {
                        hata.title = line.replace('Arıza Adı:', '').trim();
                    } else if (line.startsWith('Açıklama:')) {
                        hata.desc = line.replace('Açıklama:', '').trim();
                    } else if (line.startsWith('Risk Seviyesi:')) {
                        const risk = line.replace('Risk Seviyesi:', '').trim().toUpperCase();
                        if (risk.includes('YÜKSEK')) hata.severity = 'high';
                        else if (risk.includes('ORTA')) hata.severity = 'medium';
                        else hata.severity = 'low';
                    } else if (line.startsWith('•') || line.startsWith('-')) {
                        hata.solutions.push(line.replace(/^[•-]\s*/, '').trim());
                    }
                }
                
                // Default values if missing
                if (!hata.title) hata.title = `Arıza ${i}`;
                if (!hata.desc) hata.desc = 'AI tarafından tespit edilen arıza.';
                if (hata.solutions.length === 0) {
                    hata.solutions = [
                        'Cihazı kontrol edin',
                        'Teknik destek alın',
                        'Servis çağırın'
                    ];
                }
                
                hatalar.push(hata);
            }
            
            return hatalar.length > 0 ? hatalar : [{
                kod: 'AI-001',
                title: 'AI Analiz Sonucu',
                desc: response.substring(0, 200) + '...',
                severity: 'medium',
                solutions: ['Detaylı analiz için teknik destek alın']
            }];
        }
        
        // Get errors based on inputs - Fuzzy matching
        function getHatalar(marka, tur, arizaKodu) {
            // Normalize inputs
            const markaLower = marka.toLowerCase();
            const turLower = tur.toLowerCase();
            
            // Find matching device type
            let turKey = null;
            if (turLower.includes('çamaşır') || turLower.includes('camasir') || turLower.includes('çamaşır makinesi')) {
                turKey = 'camasir';
            } else if (turLower.includes('bulaşık') || turLower.includes('bulasik') || turLower.includes('bulaşık makinesi')) {
                turKey = 'bulasik';
            } else if (turLower.includes('kombi') || turLower.includes('kazan')) {
                turKey = 'kombi';
            } else if (turLower.includes('klima') || turLower.includes('klim')) {
                turKey = 'klima';
            } else if (turLower.includes('buzdolabı') || turLower.includes('buzdolabi') || turLower.includes('buz dolabı')) {
                turKey = 'buzdolabi';
            }
            
            if (!turKey) return [];
            
            const turData = ARIZA_KODLARI[turKey];
            if (!turData) return [];
            
            // Find matching brand
            let markaKey = null;
            const markaKeys = Object.keys(turData);
            
            for (const key of markaKeys) {
                if (markaLower.includes(key) || key.includes(markaLower)) {
                    markaKey = key;
                    break;
                }
            }
            
            // If no exact match, try common brand variations
            if (!markaKey) {
                const brandMappings = {
                    'arcelik': ['arçelik', 'arcelik'],
                    'beko': ['beko'],
                    'vestel': ['vestel'],
                    'bosch': ['bosch'],
                    'siemens': ['siemens'],
                    'profilo': ['profilo'],
                    'lg': ['lg'],
                    'samsung': ['samsung'],
                    'hotpoint': ['hotpoint', 'hot point'],
                    'indesit': ['indesit'],
                    'whirlpool': ['whirlpool'],
                    'electrolux': ['electrolux'],
                    'ariston': ['ariston'],
                    'demirdokum': ['demirdöküm', 'demirdokum', 'demir döküm'],
                    'vaillant': ['vaillant'],
                    'baymak': ['baymak'],
                    'eca': ['eca'],
                    'daikin': ['daikin'],
                    'mitsubishi': ['mitsubishi'],
                    'fujitsu': ['fujitsu'],
                    'airfel': ['airfel'],
                    'ferroli': ['ferroli']
                };
                
                for (const [key, variations] of Object.entries(brandMappings)) {
                    if (variations.some(v => markaLower.includes(v))) {
                        if (turData[key]) {
                            markaKey = key;
                            break;
                        }
                    }
                }
            }
            
            if (!markaKey) return [];
            
            const markaData = turData[markaKey];
            if (!markaData) return [];
            
            // If specific error code provided, filter for it
            if (arizaKodu && markaData[arizaKodu]) {
                return [{ kod: arizaKodu, ...markaData[arizaKodu] }];
            }
            
            // Return all errors for this brand/type
            return Object.entries(markaData).map(([kod, data]) => ({
                kod: kod,
                ...data
            }));
        }
        
        // Display results
        function gosterSonuclar(marka, tur, model, hatalar) {
            const markaFormatted = marka.charAt(0).toUpperCase() + marka.slice(1);
            const turFormatted = tur.charAt(0).toUpperCase() + tur.slice(1);
            
            document.getElementById('resultMarka').textContent = markaFormatted;
            document.getElementById('resultModel').textContent = model ? model + ' - ' + turFormatted : turFormatted;
            
            // Update stats
            document.getElementById('statKod').textContent = hatalar.length;
            document.getElementById('statYuksek').textContent = hatalar.filter(h => h.severity === 'high').length;
            document.getElementById('statOrta').textContent = hatalar.filter(h => h.severity === 'medium').length;
            
            // Generate error cards
            const errorList = document.getElementById('errorList');
            
            if (hatalar.length === 0) {
                errorList.innerHTML = `
                    <div class="no-results">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <h3>Arıza Kodu Bulunamadı</h3>
                        <p>Bu model için veritabanında arıza kodu bulunmamaktadır.</p>
                        <p style="margin-top:10px;font-size:13px;">Lütfen farklı bir model veya marka seçin.</p>
                    </div>
                `;
            } else {
                errorList.innerHTML = hatalar.map(hata => `
                    <div class="error-card">
                        <div class="error-header">
                            <div class="error-code">${hata.kod}</div>
                            <div class="error-severity severity-${hata.severity}">
                                ${hata.severity === 'high' ? 'YÜKSEK RİSK' : hata.severity === 'medium' ? 'ORTA RİSK' : 'DÜŞÜK RİSK'}
                            </div>
                        </div>
                        <div class="error-title">${hata.title}</div>
                        <div class="error-desc">${hata.desc}</div>
                        <div class="solution-box">
                            <div class="solution-title">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                Önerilen Çözümler
                            </div>
                            <ul class="solution-list">
                                ${hata.solutions.map(sol => `<li>${sol}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `).join('');
            }
            
            document.getElementById('resultsCard').classList.add('show');
            
            // Scroll to results
            document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
