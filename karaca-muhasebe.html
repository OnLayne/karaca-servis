<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KARACA MUHASEBE - Gelir Gider Takibi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            padding-bottom: 100px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #fbbf24;
            color: white;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        /* Back Button */
        .back-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        
        /* Container */
        .container {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .summary-card.gelir {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .summary-card.gider {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .summary-card.net {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
        }
        .summary-card.net.negative {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        .summary-value {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .summary-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Card */
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Input Grid */
        .input-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        /* Table */
        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f3f4f6;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        tr:hover {
            background: #f9fafb;
        }
        .type-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .type-gelir {
            background: #d1fae5;
            color: #065f46;
        }
        .type-gider {
            background: #fee2e2;
            color: #991b1b;
        }
        .amount {
            font-weight: 700;
        }
        .amount-gelir {
            color: #059669;
        }
        .amount-gider {
            color: #dc2626;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        /* Filter */
        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .filter-btn.active {
            border-color: #3b82f6;
            background: #dbeafe;
            color: #1e40af;
        }
        
        /* Navigation */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #9ca3af;
            font-size: 11px;
            font-weight: 500;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1e40af;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* Date Range */
        .date-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        @media (max-width: 640px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
            .input-grid {
                grid-template-columns: 1fr;
            }
            .date-range {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="geriDon()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Geri
        </button>
        <h1>KARACA MUHASEBE</h1>
        <p>Gelir - Gider Takip Sistemi</p>
    </div>
    
    <div class="container">
        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="summary-card gelir">
                <div class="summary-value" id="toplamGelir">0.00</div>
                <div class="summary-label">Toplam Gelir</div>
            </div>
            <div class="summary-card gider">
                <div class="summary-value" id="toplamGider">0.00</div>
                <div class="summary-label">Toplam Gider</div>
            </div>
            <div class="summary-card net" id="netCard">
                <div class="summary-value" id="netTutar">0.00</div>
                <div class="summary-label">Net Durum</div>
            </div>
        </div>
        
        <!-- Add Transaction Card -->
        <div class="card">
            <div class="card-title">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                Yeni Kayıt Ekle
            </div>
            
            <div class="input-grid">
                <div class="input-group">
                    <label>Açıklama</label>
                    <input type="text" id="aciklama" placeholder="Örn: Kira, Maaş, Satış...">
                </div>
                <div class="input-group">
                    <label>Tutar (TL)</label>
                    <input type="number" id="tutar" placeholder="0.00" step="0.01">
                </div>
                <div class="input-group">
                    <label>Tür</label>
                    <select id="tur">
                        <option value="gelir">Gelir (+)</option>
                        <option value="gider">Gider (-)</option>
                    </select>
                </div>
            </div>
            
            <div class="input-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 12px;">
                <div class="input-group">
                    <label>Tarih</label>
                    <input type="date" id="tarih">
                </div>
                <div class="input-group">
                    <label>Kategori</label>
                    <select id="kategori">
                        <option value="genel">Genel</option>
                        <option value="kira">Kira</option>
                        <option value="maaş">Maaş</option>
                        <option value="fatura">Fatura</option>
                        <option value="malzeme">Malzeme</option>
                        <option value="yakıt">Yakıt</option>
                        <option value="servis">Servis</option>
                        <option value="diğer">Diğer</option>
                    </select>
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="kayitEkle()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Kayıt Ekle
            </button>
        </div>
        
        <!-- Transactions Card -->
        <div class="card" style="margin-bottom: 80px;">
            <div class="card-title">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                İşlem Geçmişi
            </div>
            
            <div class="filter-row">
                <button class="filter-btn active" onclick="filtrele('hepsi')">Tümü</button>
                <button class="filter-btn" onclick="filtrele('gelir')">Gelirler</button>
                <button class="filter-btn" onclick="filtrele('gider')">Giderler</button>
            </div>
            
            <div class="date-range">
                <input type="date" id="baslangicTarih" onchange="tarihFiltrele()">
                <input type="date" id="bitisTarih" onchange="tarihFiltrele()">
            </div>
            
            <div class="table-container">
                <table id="islemTablosu">
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Açıklama</th>
                            <th>Kategori</th>
                            <th>Tür</th>
                            <th>Tutar</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabloGovde">
                        <!-- Rows will be inserted here -->
                    </tbody>
                </table>
            </div>
            
            <div class="btn-row" style="margin-top: 16px;">
                <button class="btn btn-secondary" onclick="exportCSV()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    CSV İndir
                </button>
                <button class="btn btn-danger" onclick="tumunuSil()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    Tümünü Sil
                </button>
            </div>
        </div>
    </div>
    
    <!-- Navigation -->
    <div class="nav-bar">
        <a href="ana-sayfa.html" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Ana Sayfa
        </a>
        <a href="karaca-yuzdelik.html" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
            Hesapla
        </a>
        <a href="karacacheat.html" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
            AI
        </a>
        <a href="karaca-muhasebe.html" class="nav-item" style="color:#3b82f6">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            Muhasebe
        </a>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <script>
        // Storage key
        const MUHASEBE_KEY = 'karaca_muhasebe_data';
        
        // Load data
        let kayitlar = JSON.parse(localStorage.getItem(MUHASEBE_KEY) || '[]');
        let currentFilter = 'hepsi';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('tarih').valueAsDate = new Date();
            document.getElementById('baslangicTarih').value = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
            document.getElementById('bitisTarih').valueAsDate = new Date();
            guncelleTablo();
            guncelleOzet();
        });
        
        // Add record
        function kayitEkle() {
            const aciklama = document.getElementById('aciklama').value.trim();
            const tutar = parseFloat(document.getElementById('tutar').value);
            const tur = document.getElementById('tur').value;
            const tarih = document.getElementById('tarih').value;
            const kategori = document.getElementById('kategori').value;
            
            if (!aciklama || !tutar || tutar <= 0) {
                showToast('Lütfen açıklama ve tutar girin');
                return;
            }
            
            const kayit = {
                id: Date.now(),
                aciklama,
                tutar,
                tur,
                tarih,
                kategori,
                eklenmeTarihi: new Date().toISOString()
            };
            
            kayitlar.unshift(kayit);
            localStorage.setItem(MUHASEBE_KEY, JSON.stringify(kayitlar));
            
            // Clear inputs
            document.getElementById('aciklama').value = '';
            document.getElementById('tutar').value = '';
            document.getElementById('kategori').value = 'genel';
            
            showToast(tur === 'gelir' ? 'Gelir kaydı eklendi' : 'Gider kaydı eklendi');
            guncelleTablo();
            guncelleOzet();
        }
        
        // Update table
        function guncelleTablo() {
            const tbody = document.getElementById('tabloGovde');
            const baslangic = document.getElementById('baslangicTarih').value;
            const bitis = document.getElementById('bitisTarih').value;
            
            let filtrelenmis = kayitlar.filter(k => {
                if (currentFilter !== 'hepsi' && k.tur !== currentFilter) return false;
                if (baslangic && k.tarih < baslangic) return false;
                if (bitis && k.tarih > bitis) return false;
                return true;
            });
            
            if (filtrelenmis.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            <p>Kayıt bulunamadı</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = filtrelenmis.map(k => `
                <tr>
                    <td>${new Date(k.tarih).toLocaleDateString('tr-TR')}</td>
                    <td>${k.aciklama}</td>
                    <td>${k.kategori || 'Genel'}</td>
                    <td><span class="type-badge type-${k.tur}">${k.tur.toUpperCase()}</span></td>
                    <td class="amount amount-${k.tur}">${k.tur === 'gelir' ? '+' : '-'} ${k.tutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</td>
                    <td>
                        <button class="delete-btn" onclick="kayitSil(${k.id})">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        // Update summary
        function guncelleOzet() {
            const baslangic = document.getElementById('baslangicTarih').value;
            const bitis = document.getElementById('bitisTarih').value;
            
            let filtrelenmis = kayitlar;
            if (baslangic || bitis) {
                filtrelenmis = kayitlar.filter(k => {
                    if (baslangic && k.tarih < baslangic) return false;
                    if (bitis && k.tarih > bitis) return false;
                    return true;
                });
            }
            
            const gelir = filtrelenmis.filter(k => k.tur === 'gelir').reduce((sum, k) => sum + k.tutar, 0);
            const gider = filtrelenmis.filter(k => k.tur === 'gider').reduce((sum, k) => sum + k.tutar, 0);
            const net = gelir - gider;
            
            document.getElementById('toplamGelir').textContent = gelir.toLocaleString('tr-TR', {minimumFractionDigits: 2});
            document.getElementById('toplamGider').textContent = gider.toLocaleString('tr-TR', {minimumFractionDigits: 2});
            document.getElementById('netTutar').textContent = net.toLocaleString('tr-TR', {minimumFractionDigits: 2});
            
            const netCard = document.getElementById('netCard');
            if (net >= 0) {
                netCard.classList.remove('negative');
            } else {
                netCard.classList.add('negative');
            }
        }
        
        // Delete record
        function kayitSil(id) {
            if (!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
            
            kayitlar = kayitlar.filter(k => k.id !== id);
            localStorage.setItem(MUHASEBE_KEY, JSON.stringify(kayitlar));
            
            showToast('Kayıt silindi');
            guncelleTablo();
            guncelleOzet();
        }
        
        // Delete all
        function tumunuSil() {
            if (!confirm('Tüm kayıtları silmek istediğinize emin misiniz? Bu işlem geri alınamaz!')) return;
            
            kayitlar = [];
            localStorage.setItem(MUHASEBE_KEY, JSON.stringify(kayitlar));
            
            showToast('Tüm kayıtlar silindi');
            guncelleTablo();
            guncelleOzet();
        }
        
        // Filter
        function filtrele(tur) {
            currentFilter = tur;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            guncelleTablo();
        }
        
        // Date filter
        function tarihFiltrele() {
            guncelleTablo();
            guncelleOzet();
        }
        
        // Export CSV
        function exportCSV() {
            if (kayitlar.length === 0) {
                showToast('İndirilecek kayıt yok');
                return;
            }
            
            const headers = ['Tarih', 'Açıklama', 'Kategori', 'Tür', 'Tutar'];
            const rows = kayitlar.map(k => [
                k.tarih,
                k.aciklama,
                k.kategori || 'Genel',
                k.tur,
                k.tutar.toString().replace('.', ',')
            ]);
            
            const csv = [headers, ...rows].map(row => row.join(';')).join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `karaca_muhasebe_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            showToast('CSV dosyası indirildi');
        }
        
        // Back
        function geriDon() {
            window.location.href = 'ana-sayfa.html';
        }
        
        // Show toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
